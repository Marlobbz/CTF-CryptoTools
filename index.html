<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF密码编解码工具箱</title>
    <link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <button class="hamburger" id="hamburgerBtn" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-logo">
            <span class="logo-mark" aria-hidden="true">CT</span>
            <h1 class="logo-title">CTF密码编解码工具箱</h1>
        </div>
        <div class="header-search">
            <input type="text" id="search-input" class="search-input" placeholder="搜索密码类型..." aria-label="搜索密码类型">
        </div>
        <button class="header-btn" id="btn-history" aria-label="打开历史记录">历史记录</button>
    </header>

    <!-- 主体布局 -->
    <div class="app-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar" id="sidebar" aria-label="密码工具分类">
            <nav class="sidebar-nav" id="category-list">
                <!-- 由 app.js 动态生成 -->
            </nav>
        </aside>

        <!-- 侧边栏遮罩（移动端） -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 当前选中的密码类型 -->
            <div class="cipher-title-bar">
                <h2 class="cipher-title" id="tool-title">Base64</h2>
                <span class="cipher-category" id="tool-category"></span>
            </div>

            <!-- 输入区域 -->
            <section class="input-section">
                <label class="section-label" for="input-area">输入内容</label>
                <textarea
                    id="input-area"
                    class="code-textarea"
                    placeholder="请输入要编码/解码的内容..."
                    rows="6"
                    spellcheck="false"
                ></textarea>
            </section>

            <!-- 操作按钮行 -->
            <div class="action-bar" role="group" aria-label="编解码操作">
                <button class="btn btn-encode" id="btn-encode" title="编码（Ctrl+Enter）">编码</button>
                <button class="btn btn-decode" id="btn-decode" title="解码（Ctrl+Shift+Enter）">解码</button>
                <button class="btn btn-swap" id="btn-swap" title="交换输入与输出" aria-label="交换输入与输出">⇄</button>
                <button class="btn" id="btn-clear" title="清空输入与输出">清空</button>
                <button class="btn" id="btn-copy" title="复制输出结果">复制</button>
                <button class="btn" id="btn-download" title="下载输出结果">下载</button>
                <button class="btn" id="btn-auto-detect" title="自动检测编码类型">自动检测</button>
            </div>

            <!-- 自动检测建议 -->
            <div class="suggestions" id="suggestions" role="region" aria-label="自动检测建议">
                <span class="suggestions-label" id="suggestions-label">检测建议（点击选择）</span>
                <div class="suggestions-list" id="suggestions-list"></div>
            </div>

            <!-- 高级选项区域 -->
            <section class="advanced-section" id="advanced-panel" style="display: none;">
                <h3 class="advanced-title">高级选项</h3>
                <div class="advanced-options" id="advanced-content">
                    <!-- 由 app.js 动态生成 -->
                </div>
            </section>

            <!-- 输出区域 -->
            <section class="output-section">
                <label class="section-label" for="output-area">输出结果</label>
                <textarea
                    id="output-area"
                    class="code-textarea output-textarea"
                    placeholder="编码/解码结果将显示在这里..."
                    rows="6"
                    readonly
                    spellcheck="false"
                ></textarea>
            </section>

            <!-- 状态提示区域 -->
            <div class="status-bar" id="status-bar" role="status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-text" id="status-text">就绪</span>
            </div>
        </main>
    </div>

    <!-- 历史记录面板遮罩 -->
    <div class="history-overlay" id="history-overlay"></div>
    <!-- 历史记录面板 -->
    <div class="history-panel" id="history-panel" role="dialog" aria-label="历史记录">
        <div class="history-header">
            <h3>历史记录</h3>
            <button class="history-close-btn" id="history-close-btn" aria-label="关闭历史记录">✕</button>
        </div>
        <div class="history-list" id="history-list">
            <!-- 由 app.js 动态生成 -->
        </div>
        <div class="history-footer">
            <button class="btn btn-danger-outline" id="btn-clear-history">清空全部</button>
            <button class="btn" id="history-done-btn">关闭</button>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>CTF密码编解码工具箱 — 专为 CTF 选手打造的多功能密码学工具</p>
        <p class="footer-sub">进制编码 · ROT密码 · 古典密码 · 传输编码 · 脚本编码 · 特殊编码 · 网络编码 · 其他密码</p>
    </footer>

    <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
